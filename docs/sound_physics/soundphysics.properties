# Ajustes recomendados de Sound Physics Remastered para Smile Protocol.
# Copiar en config/sound_physics_remastered/soundphysics.properties del cliente (o fusionar a mano).
# Solo se fijan las claves que importan para el juego; el resto se deja como venga.

enabled=true

# Salas de hormigon y pasillos largos: eco notable pero sin tapar las voces
reverb_gain=1.15
reverb_brightness=0.85
default_block_reflectivity=0.6

# Las paredes y puertas del laboratorio ahogan bastante: lo que suena tras una puerta se oye apagado
block_absorption=1.2
default_block_occlusion_factor=1.0
max_occlusion_rays=16
strict_occlusion=false

# Los pasos y gritos lejanos pierden agudos
air_absorption=1.0
attenuation_factor=1.0

# Calidad (bajar si hay tirones)
environment_evaluation_ray_count=32
environment_evaluation_ray_bounces=4
update_moving_sounds=true
sound_update_interval=5

# Voz de proximidad con eco y oclusion; sin oirse uno mismo
simple_voice_chat_integration=true
simple_voice_chat_hear_self=false

unsafe_level_access=false
