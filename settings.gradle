pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'smileprotocol'

// common: codigo compartido, compilado contra Minecraft sin loader
// fabric y neoforge: un jar por loader, cada uno con el codigo comun dentro
include 'common', 'fabric', 'neoforge'
