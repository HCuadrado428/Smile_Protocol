plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.80' apply false
}

subprojects {
    apply plugin: 'java'

    group = mod_group
    version = mod_version

    base {
        archivesName = "${mod_id}-${project.name}-${minecraft_version}"
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
        withSourcesJar()
    }

    repositories {
        mavenCentral()
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        maven {
            name = 'GeckoLib'
            url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content { includeGroupByRegex('software\\.bernie.*'); includeGroup('com.eliotlash.mclib') }
        }
        // Veil y sus librerias (molang-compiler...)
        maven { name = 'BlameJared'; url = 'https://maven.blamejared.com/' }
        maven {
            name = 'henkelmax'
            url = 'https://maven.maxhenkel.de/repository/public'
            content { includeGroup('de.maxhenkel.voicechat') }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = java_version as int
    }

    // Variables que se sustituyen en fabric.mod.json, neoforge.mods.toml y pack.mcmeta
    ext.modProps = [
            mod_id                       : mod_id,
            mod_name                     : mod_name,
            mod_version                  : mod_version,
            mod_authors                  : mod_authors,
            mod_license                  : mod_license,
            mod_description              : mod_description,
            minecraft_version            : minecraft_version,
            minecraft_version_range      : minecraft_version_range,
            neoforge_version             : neoforge_version,
            neoforge_loader_version_range: neoforge_loader_version_range,
            fabric_loader_version        : fabric_loader_version,
            geckolib_version             : geckolib_version,
            veil_version                 : veil_version,
            java_version                 : java_version,
    ]
}
