modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Modelos y animaciones de mobs, bloques e items
[[dependencies.${mod_id}]]
    modId="geckolib"
    mandatory=true
    versionRange="[4.4,)"
    ordering="AFTER"
    side="BOTH"

# Iluminacion dinamica (linterna). Sin Veil el mod no carga (README 21.1)
[[dependencies.${mod_id}]]
    modId="veil"
    mandatory=true
    versionRange="[1.0.0,)"
    ordering="AFTER"
    side="BOTH"

# Animaciones del jugador
[[dependencies.${mod_id}]]
    modId="playeranimator"
    mandatory=true
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"

# Voz de proximidad: opcional (README 7.4). Sus versiones llevan delante la de Minecraft (1.20.1-2.6.22)
[[dependencies.${mod_id}]]
    modId="voicechat"
    mandatory=false
    versionRange="[1.20.1-2.4,)"
    ordering="AFTER"
    side="BOTH"
