modLoader="javafml"
loaderVersion="${neoforge_loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neoforge_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[4.5,)"
    ordering="AFTER"
    side="BOTH"

# Iluminacion dinamica: sin Veil el mod no carga (README 21.1)
[[dependencies.${mod_id}]]
    modId="veil"
    type="required"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

# Voz de proximidad: opcional (README 7.4)
[[dependencies.${mod_id}]]
    modId="voicechat"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[mixins]]
config="smileprotocol.mixins.json"
