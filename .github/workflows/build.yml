name: Build

on:
  push:
    branches-ignore: [ci-logs, ci-wrapper]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compilar (Fabric y NeoForge)
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Marcar errores
        if: failure()
        shell: bash
        run: |
          grep -nE "error:|What went wrong|Could not (resolve|find)|FAILED" build.log | grep -vE "^\s*$" | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done || true
          grep -nA12 "What went wrong" build.log | head -60 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done || true

      # Firmas de las librerias para escribir codigo contra su API exacta. Nunca hace fallar el job.
      - name: Inspeccionar librerias
        if: always()
        shell: bash
        run: |
          set +e
          out="$GITHUB_WORKSPACE/libs.txt"
          : > "$out"
          [ -f tools/inspect.txt ] || exit 0
          while read -r pattern classes; do
            [ -z "$pattern" ] && continue
            jar=$(find ~/.gradle/caches -name "$pattern" 2>/dev/null | grep -v sources | head -1)
            echo "=== $pattern -> $jar" >> "$out"
            [ -z "$jar" ] && continue
            if [ "$classes" = "LIST" ]; then
              unzip -Z1 "$jar" | grep '\.class$' | grep -v '\$' | sed 's#\.class$##' >> "$out"
              continue
            fi
            for cls in ${classes//,/ }; do
              echo "--- $cls" >> "$out"
              javap -cp "$jar" -p "$cls" >> "$out" 2>&1
            done
          done < tools/inspect.txt
          exit 0

      # Arranca un servidor de cada loader sin jugadores: se aplican los mixins y se colocan todas
      # las plantas (SelfTest). Nunca hace fallar el job; el resultado va a smoke.log.
      - name: Prueba en servidor
        if: success()
        shell: bash
        env:
          SMILEPROTOCOL_SELFTEST: "1"
        run: |
          set +e
          : > smoke.log
          for L in neoforge fabric; do
            mkdir -p $L/runs/server
            echo "eula=true" > $L/runs/server/eula.txt
            printf 'online-mode=false\nspawn-protection=0\nlevel-type=minecraft\\:flat\n' > $L/runs/server/server.properties
            timeout 900 ./gradlew :$L:runServer --no-daemon > smoke-$L.log 2>&1
            echo "== $L: salida $?" >> smoke.log
            grep -aE "SELFTEST|[Mm]ixin.*([Ff]ail|[Ee]rror|[Ee]xception)|Exception|ERROR|Caused by|Done \(" smoke-$L.log | head -200 >> smoke.log
          done
          exit 0

      # El log (y los jar) se guardan en la rama ci-logs para poder leerlos sin la API de Actions
      - name: Guardar el log y los jar
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -f build.log ] || exit 0
          mkdir /tmp/logs && cd /tmp/logs
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin ci-logs; then git checkout -q ci-logs; else git checkout -q --orphan ci-logs; fi
          mkdir -p logs
          cp "$GITHUB_WORKSPACE/build.log" "logs/${GITHUB_SHA}.log"
          cp "$GITHUB_WORKSPACE/build.log" latest.log
          [ -s "$GITHUB_WORKSPACE/libs.txt" ] && cp "$GITHUB_WORKSPACE/libs.txt" "logs/${GITHUB_SHA}-libs.txt"
          [ -s "$GITHUB_WORKSPACE/smoke.log" ] && cp "$GITHUB_WORKSPACE/smoke.log" "logs/${GITHUB_SHA}-smoke.log"
          for L in neoforge fabric; do [ -s "$GITHUB_WORKSPACE/smoke-$L.log" ] && tail -c 400000 "$GITHUB_WORKSPACE/smoke-$L.log" > "logs/${GITHUB_SHA}-smoke-$L.log"; done
          jars=$(ls "$GITHUB_WORKSPACE"/fabric/build/libs/*.jar "$GITHUB_WORKSPACE"/neoforge/build/libs/*.jar 2>/dev/null | grep -v -- '-sources' || true)
          if [ -n "$jars" ]; then
            mkdir -p jars && rm -f jars/*.jar
            cp $jars jars/
            echo "${GITHUB_SHA}" > jars/COMMIT
          fi
          git add -A
          git commit -qm "log ${GITHUB_SHA}"
          git push -q origin HEAD:ci-logs

      - name: Subir los jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smileprotocol-jars
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
          if-no-files-found: error
