name: Build

on:
  push:
    branches-ignore: [ci-logs, ci-wrapper]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compilar el mod
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Marcar errores
        if: failure()
        shell: bash
        run: |
          grep -nE "error:|What went wrong|Could not (resolve|find)|FAILED|Exception" build.log | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done

      # Temporal: comparar los jar de Veil (completo y slim)
      - name: Inspeccionar Veil
        if: always()
        shell: bash
        run: |
          set +e
          base=https://maven.blamejared.com/foundry/veil/Veil-forge-1.20.1/1.0.0.287
          for f in Veil-forge-1.20.1-1.0.0.287.jar Veil-forge-1.20.1-1.0.0.287-slim.jar; do
            curl -sSfL -o "/tmp/$f" "$base/$f"
            echo "=== $f"
            unzip -l "/tmp/$f" | awk '{print $4}' | grep -E '\.class$' | sed -E 's#/[^/]+\.class$##' | sort | uniq -c | sort -rn | head -40
            echo "--- jarjar"
            unzip -l "/tmp/$f" | awk '{print $4}' | grep -E '^META-INF/jarjar/' 
            unzip -p "/tmp/$f" META-INF/jarjar/metadata.json 2>/dev/null | head -60
            echo "--- org/lwjgl"
            unzip -l "/tmp/$f" | awk '{print $4}' | grep '^org/lwjgl' | head -20
          done > "$GITHUB_WORKSPACE/libs.txt" 2>&1
          exit 0

      # El log se guarda en la rama ci-logs para poder leerlo sin acceso a la API de Actions
      - name: Guardar el log
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -f build.log ] || exit 0
          mkdir /tmp/logs && cd /tmp/logs
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin ci-logs; then git checkout -q ci-logs; else git checkout -q --orphan ci-logs; fi
          mkdir -p logs
          cp "$GITHUB_WORKSPACE/build.log" "logs/${GITHUB_SHA}.log"
          cp "$GITHUB_WORKSPACE/build.log" latest.log
          [ -f "$GITHUB_WORKSPACE/libs.txt" ] && cp "$GITHUB_WORKSPACE/libs.txt" "logs/${GITHUB_SHA}-libs.txt"
          # Ultimo jar compilado, para poder descargarlo sin la pestana Actions
          if ls "$GITHUB_WORKSPACE"/build/libs/*.jar >/dev/null 2>&1; then
            mkdir -p jars && rm -f jars/*.jar
            cp "$GITHUB_WORKSPACE"/build/libs/*.jar jars/
            echo "${GITHUB_SHA}" > jars/COMMIT
          fi
          git add -A
          git commit -qm "log ${GITHUB_SHA}"
          git push -q origin HEAD:ci-logs

      - name: Subir el jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smileprotocol-jar
          path: build/libs/*.jar
          if-no-files-found: error
